name: Deploy til GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Én deployment ad gangen. Igangværende kørsler afbrydes ikke, så et
# push midt i en deployment ikke efterlader siden halvt opdateret.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Valider JavaScript-syntaks
        run: |
          shopt -s globstar nullglob
          for f in assets/js/**/*.js; do
            node --check "$f"
          done

      - name: Tjek at alle sider findes
        run: test -f index.html && test -f progress.html

      # Pages skal være slået til én gang under Settings → Pages med
      # "Source: GitHub Actions". Workflowet kan ikke slå det til selv —
      # GITHUB_TOKEN har ikke rettigheder til at oprette Pages-sitet.
      - name: Konfigurér Pages
        uses: actions/configure-pages@v5

      - name: Pak sitet
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
